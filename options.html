<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>E-edition Cleanup Settings</title>
    <style>
      body {
        box-sizing: border-box;
        color: #202124;
        font: 16px/1.5 system-ui, sans-serif;
        margin: 0 auto;
        max-width: 42rem;
        padding: 2rem 1rem;
      }

      h1 {
        font-size: 1.5rem;
      }

      label {
        display: block;
        font-weight: 600;
        margin: 1.5rem 0 0.5rem;
      }

      textarea {
        box-sizing: border-box;
        font: inherit;
        min-height: 12rem;
        padding: 0.6rem;
        width: 100%;
      }

      button {
        font: inherit;
        margin-top: 1rem;
        padding: 0.45rem 1rem;
      }

      #status {
        min-height: 1.5em;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>E-edition Cleanup Settings</h1>
      <p>
        Choose which sites the extension runs on. Enter one hostname per line,
        such as <code>example.com</code>. Subdomains are included.
      </p>
      <form id="site-form">
        <label for="sites">Enabled site hostnames</label>
        <textarea id="sites" name="sites" spellcheck="false"></textarea>
        <button type="submit">Save sites</button>
      </form>
      <p id="status" role="status" aria-live="polite"></p>
      <p>Reload open e-edition tabs after saving for the changes to take effect.</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
